<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Launcher — Reconstruction</title>
<meta name="description" content="Le site de Team Launcher est en cours de reconstruction. Le launcher et le jeu restent disponibles.">
<link rel="icon" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0f1a;
    --fg: #eef2ff;
    --muted: #94a3b8;
    --card: rgba(255,255,255,.04);
    --line: rgba(255,255,255,.08);
    --accent: #60a5fa;
    --accent2: #a78bfa;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: Manrope, system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow-x: hidden;
  }
  header {
    display: flex;
    align-items: center;
    padding: 28px 48px;
    border-bottom: 1px solid var(--line);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: inherit;
    text-decoration: none;
  }
  .brand img { width: 30px; height: 30px; }
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px 80px;
    text-align: center;
  }
  .inner {
    max-width: 680px;
  }
  .glass {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: clamp(32px, 5vw, 56px);
  }
  .mark {
    width: 48px; height: 48px;
    margin: 0 auto 22px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    position: relative;
  }
  .mark::after {
    content: "";
    position: absolute;
    inset: 12px;
    border: 3px solid rgba(255,255,255,.95);
    border-radius: 50%;
    border-right-color: transparent;
    animation: spin 1s linear infinite;
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  h1 {
    font-size: clamp(2rem, 4.5vw, 3rem);
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1.1;
    margin-bottom: 16px;
  }
  .lead {
    color: var(--muted);
    font-size: 1.05rem;
    line-height: 1.7;
    max-width: 48ch;
    margin: 0 auto 32px;
  }
  .bar {
    height: 4px;
    background: rgba(255,255,255,.06);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 28px;
  }
  .bar > i {
    display: block;
    height: 100%;
    width: 42%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    animation: slide 2.6s ease-in-out infinite;
  }
  @keyframes slide {
    0% { width: 24%; margin-left: 0; }
    50% { width: 48%; margin-left: 28%; }
    100% { width: 24%; margin-left: 76%; }
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 32px;
  }
  .stat {
    background: rgba(255,255,255,.03);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 10px;
  }
  .stat b {
    display: block;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .stat span {
    font-size: 12px;
    color: var(--muted);
  }
  .actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
  a.btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 13px 20px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 12px;
    text-decoration: none;
    transition: .15s ease;
  }
  .btn-ghost {
    color: var(--fg);
    border: 1px solid var(--line);
    background: rgba(255,255,255,.03);
  }
  .btn-ghost:hover { background: rgba(255,255,255,.06); }
  footer {
    padding: 22px 48px;
    border-top: 1px solid var(--line);
    text-align: center;
    font-size: 13px;
    color: var(--muted);
  }
  footer a { color: var(--muted); text-decoration: none; margin: 0 8px; }
  footer a:hover { color: var(--fg); }
  @media (max-width: 560px) {
    header, footer { padding: 18px; }
    .stats { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <a class="brand" href="index.html">
    <img src="img/logo.png" alt="">
    Team Launcher
  </a>
</header>

<main>
  <div class="inner">
    <div class="glass">
      <div class="mark"></div>
      <h1>On peaufine le nouveau site.</h1>
      <p class="lead">
        Quelques travaux de fond en cours. Le téléchargement du launcher
        et le jeu restent disponibles pendant toute la durée des travaux.
      </p>

      <div class="bar"><i></i></div>

      <div class="stats">
        <div class="stat">
          <b>Design</b>
          <span>En cours</span>
        </div>
        <div class="stat">
          <b>Contenu</b>
          <span>En cours</span>
        </div>
        <div class="stat">
          <b>Relance</b>
          <span>Bientôt</span>
        </div>
      </div>

      <div class="actions">
        <a class="btn btn-ghost" href="contact.html">Nous contacter</a>
      </div>
    </div>
  </div>
</main>

<footer>
  © 2026 Team Launcher
  ·
  <a href="mentions-legales.html">Mentions légales</a>
  ·
  <a href="contact.html">Contact</a>
</footer>
</body>
</html>
